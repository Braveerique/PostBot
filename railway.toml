# Railway Configuration
# This file tells Railway how to deploy your PostBot

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python start.py"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[variables]
# These will be overridden by environment variables set in Railway dashboard
CHECK_INTERVAL = "30"
STREAM_TITLE = "Live Stream"
STREAM_GAME = "Just Chatting"